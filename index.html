<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061018"><link rel="manifest" href="manifest.webmanifest"><title>ViA — Menu des horloges</title><style>:root{--bg:#061018;--panel:#0d202b;--line:#b7e2f233;--text:#effbff;--muted:#9ab7c5;--green:#55e7cf;--yellow:#ffd34e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#24657d,#061018 46%,#020609);color:var(--text);font:16px system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:24px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--yellow),var(--green));color:#061018;font-weight:900}.brand h1{margin:0;letter-spacing:.08em;text-transform:uppercase}.lead{color:var(--muted);line-height:1.6}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input{flex:1;min-width:230px}input,button{padding:11px 15px;border-radius:999px;border:1px solid var(--line);background:#ffffff0b;color:var(--text);font:inherit}button{cursor:pointer}button:hover{border-color:var(--green);background:#55e7cf1c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.clock-link{display:block;text-decoration:none;color:inherit;background:#0d202bdd;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 15px 35px #0007;transition:.2s}.clock-link:hover{transform:translateY(-3px);border-color:var(--green)}.clock-link h2{margin:0 0 5px}.clock-link p{margin:0;color:var(--muted);font-size:.86rem}.badge{display:inline-block;margin-top:18px;color:var(--green);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}</style></head><body><main class="app"><header class="brand"><div class="logo">V</div><h1>ViA Time Atlas</h1></header><p class="lead">Chaque horloge possède sa propre page. Choisis un bouton pour ouvrir une horloge isolée, avec sa spirale ADN, ses 60 cercles de secondes, ses 60 anneaux de minutes et ses 24 cercles d’heures.</p><div class="toolbar"><input id="search" placeholder="Rechercher une ville ou région…"><button onclick="location.href='coff.html'">Page Coff</button></div><section id="menu" class="grid"></section></main><script>const clocks=[['UTC','Greenwich','clock-utc.html'],['Paris','France','clock-paris.html'],['Londres','Royaume-Uni','clock-london.html'],['New York','États-Unis','clock-new-york.html'],['Los Angeles','États-Unis','clock-los-angeles.html'],['Mexico','Mexique','clock-mexico.html'],['São Paulo','Brésil','clock-sao-paulo.html'],['Le Caire','Égypte','clock-cairo.html'],['Johannesburg','Afrique du Sud','clock-johannesburg.html'],['Dubai','Émirats arabes unis','clock-dubai.html'],['Mumbai','Inde','clock-mumbai.html'],['Singapore','Singapour','clock-singapore.html'],['Tokyo','Japon','clock-tokyo.html'],['Séoul','Corée du Sud','clock-seoul.html'],['Shanghai','Chine','clock-shanghai.html'],['Sydney','Australie','clock-sydney.html'],['Auckland','Nouvelle-Zélande','clock-auckland.html']];function render(){const q=document.querySelector('#search').value.toLowerCase();document.querySelector('#menu').innerHTML=clocks.filter(x=>x.join(' ').toLowerCase().includes(q)).map(x=>`<a class="clock-link" href="${x[2]}"><h2>${x[0]}</h2><p>${x[1]}</p><span class="badge">Ouvrir cette horloge →</span></a>`).join('')}document.querySelector('#search').oninput=render;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
