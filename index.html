<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061018">
  <link rel="manifest" href="manifest.webmanifest">
  <title>ViA — Menu des horloges</title>
  <style>
    :root {
      --bg: #061018;
      --panel: #0d202b;
      --line: #b7e2f233;
      --text: #effbff;
      --muted: #9ab7c5;
      --green: #55e7cf;
      --yellow: #ffd34e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #24657d, #061018 46%, #020609);
      color: var(--text);
      font: 16px system-ui, sans-serif;
    }

    .app {
      max-width: 1100px;
      margin: auto;
      padding: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--yellow), var(--green));
      color: #061018;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: clamp(1.2rem, 2.5vw, 2rem);
    }

    .lead {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    input, button {
      padding: 11px 15px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #ffffff0b;
      color: var(--text);
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      border-color: var(--green);
      background: #55e7cf1c;
    }

    .toolbar input {
      flex: 1;
      min-width: 230px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .clock-link {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #0d202bdd;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 15px 35px #0007;
      transition: 0.2s ease;
    }

    .clock-link:hover {
      transform: translateY(-3px);
      border-color: var(--green);
    }

    .clock-link h2 {
      margin: 0 0 5px;
    }

    .clock-link p {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .badge {
      display: inline-block;
      margin-top: 18px;
      color: var(--green);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand">
      <div class="logo">V</div>
      <h1>ViA Time Atlas</h1>
    </header>

    <p class="lead">
      Chaque horloge possède sa propre page unique. Le modèle est partagé, et chaque bouton ouvre une horloge isolée avec son fuseau horaire.
    </p>

    <div class="toolbar">
      <input id="search" placeholder="Rechercher une ville ou région…">
      <button onclick="location.href='coff.html'">Page Coff</button>
    </div>

    <section id="menu" class="grid"></section>
  </main>

  <script>
    const clocks = [
      ['UTC', 'Monde', 'clock.html?zone=utc'],
      ['Paris', 'France', 'clock.html?zone=paris'],
      ['Londres', 'Royaume-Uni', 'clock.html?zone=london'],
      ['New York', 'États-Unis', 'clock.html?zone=newyork'],
      ['Los Angeles', 'États-Unis', 'clock.html?zone=losangeles'],
      ['Mexico', 'Mexique', 'clock.html?zone=mexico'],
      ['São Paulo', 'Brésil', 'clock.html?zone=saopaulo'],
      ['Le Caire', 'Égypte', 'clock.html?zone=cairo'],
      ['Johannesburg', 'Afrique du Sud', 'clock.html?zone=johannesburg'],
      ['Dubai', 'Émirats', 'clock.html?zone=dubai'],
      ['Mumbai', 'Inde', 'clock.html?zone=mumbai'],
      ['Singapore', 'Singapour', 'clock.html?zone=singapore'],
      ['Tokyo', 'Japon', 'clock.html?zone=tokyo'],
      ['Séoul', 'Corée du Sud', 'clock.html?zone=seoul'],
      ['Shanghai', 'Chine', 'clock.html?zone=shanghai'],
      ['Sydney', 'Australie', 'clock.html?zone=sydney'],
      ['Auckland', 'Nouvelle-Zélande', 'clock.html?zone=auckland']
    ];

    function render() {
      const query = document.querySelector('#search').value.toLowerCase();
      const filtered = clocks.filter(([name, country, url]) =>
        `${name} ${country}`.toLowerCase().includes(query)
      );

      document.querySelector('#menu').innerHTML = filtered.map(
        ([name, country, url]) => `
          <a class="clock-link" href="${url}">
            <h2>${name}</h2>
            <p>${country}</p>
            <span class="badge">Ouvrir cette horloge →</span>
          </a>
        `
      ).join('');
    }

    document.querySelector('#search').addEventListener('input', render);
    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
