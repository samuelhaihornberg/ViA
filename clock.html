<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061018">
  <link rel="manifest" href="manifest.webmanifest">
  <title>ViA — Horloge UTC</title>
  <style>
    :root{--bg:#061018;--panel:#0d202bdd;--line:#b7e2f233;--text:#effbff;--muted:#9ab7c5;--pink:#ff79c6;--red:#ff5267;--yellow:#ffd34e;--green:#55e7cf;--blue:#70baff;--violet:#a98cff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#24657d,#061018 46%,#020609);color:var(--text);font:16px system-ui,sans-serif}.app{max-width:1150px;margin:auto;padding:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#ffffff0b;color:var(--text);font:inherit;cursor:pointer}button:hover{border-color:var(--green);background:#55e7cf1c}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px #0009;backdrop-filter:blur(14px)}.stage{height:min(72vh,700px);min-height:430px;position:relative;display:grid;place-items:center;overflow:hidden}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.center{z-index:1;text-align:center;pointer-events:none}.zone,.date{color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-size:.8rem}.time{font-size:clamp(2.1rem,8vw,6rem);font-weight:800;text-shadow:0 0 28px #55e7cf77}.caption{text-align:center;color:var(--muted);line-height:1.6}.legend{padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.legend span{padding:10px;border:1px solid #ffffff12;border-radius:12px}.ms{color:var(--pink)}.seconds{color:var(--red)}.minutes{color:var(--yellow)}.hours{color:var(--green)}.calendar{color:var(--blue)}
  </style>
</head>
<body>
  <main class="app">
    <nav class="nav"><button id="back">← Menu des horloges</button><button id="coff">Page Coff</button></nav>
    <section class="panel stage"><canvas id="clock"></canvas><div class="center"><div id="name" class="zone">UTC</div><div id="country" class="zone">Monde</div><div id="time" class="time">00:00:00.000</div><div id="date" class="date">—</div></div></section>
    <p class="caption">Pointeur laser photoplasma · vagues colorées · expansion des millisecondes à l’année · UTC mondial par défaut</p>
    <section class="panel legend"><span class="ms">● Millisecondes</span><span class="seconds">● 60 anneaux de secondes</span><span class="minutes">● 60 anneaux de minutes</span><span class="hours">● 24 anneaux d’heures</span><span class="calendar">● Jour · mois · année</span></section>
  </main>
  <script src="clock.js"></script>
</body>
</html>
