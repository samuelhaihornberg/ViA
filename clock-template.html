<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061018"><link rel="manifest" href="manifest.webmanifest"><title>ViA Horloge</title><style>:root{--bg:#061018;--panel:#0d202bdd;--line:#b7e2f233;--text:#effbff;--muted:#9ab7c5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#24657d,#061018 45%,#020609);color:var(--text);font:16px system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#ffffff0b;color:var(--text);cursor:pointer}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px #0009}.stage{height:min(72vh,700px);min-height:420px;position:relative;display:grid;place-items:center;overflow:hidden}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.center{z-index:1;text-align:center;pointer-events:none}.zone,.date{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:.8rem}.time{font-size:clamp(2.2rem,8vw,6rem);font-weight:800;text-shadow:0 0 28px #55e7cf77}.caption{text-align:center;color:var(--muted);line-height:1.5}.legend{padding:18px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}.red{color:#ff5267}.yellow{color:#ffd34e}.green{color:#55e7cf}</style></head><body data-clock="KEY"><main class="app"><nav class="nav"><button id="back">← Menu des horloges</button><button id="coff">Page Coff</button></nav><section class="panel stage"><canvas id="clock"></canvas><div class="center"><div id="name" class="zone">Horloge</div><div id="country" class="zone"></div><div id="time" class="time">00:00:00.000</div><div id="date" class="date">—</div></div></section><p class="caption">Spirale ADN · bulles expansives · queue de ouistiti · 60 secondes · 60 minutes · 24 heures</p><section class="panel legend"><span class="red">● 60 cercles fins de secondes</span><span class="yellow">● 60 cercles épais de minutes</span><span class="green">● 24 cercles verts d’heures</span></section></main><script src="clock.js"></script></body></html>
